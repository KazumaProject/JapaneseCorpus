[package]
name = "japanese-corpus-converter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kana-kanji conversion engine for JapaneseCorpus n-gram dictionaries"

[lib]
name = "japanese_corpus_converter"

[[bin]]
name = "kana-kanji-converter"
path = "src/main.rs"

[[bin]]
name = "ajimee-bench"
path = "src/bin/ajimee-bench.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
