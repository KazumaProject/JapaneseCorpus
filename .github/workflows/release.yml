name: Build and publish corpus

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when source versions are unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ngram-builder/**"
      - "jmdict-builder/**"
      - "conversion-engine/**"
      - "schema/**"
      - "pyproject.toml"
      - "NOTICE.md"
      - "LICENSE-DATA.md"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: corpus-release
  cancel-in-progress: false

env:
  MOZC_COMMIT: 3f235b4eb6fcff7d14ef5f0fb8ee56de7ee4c732
  MOZC_ID_DEF_SHA256: 07a05a268c3783b7e02b36e4aa591555a2dd19a1f3c93891576740761c154f2d
  VIBRATO_IPADIC_VERSION: v0.5.0-ipadic-mecab-2_7_0
  VIBRATO_IPADIC_ARCHIVE_SHA256: 4764f983b7c3a9e1cb6a5ee945e00558efd812980e0dad61224f63ee3b0475d9
  AJIMEE_COMMIT: 401666cd56d1a570c2021798b64b6da4396bfd45
  AJIMEE_DATA_SHA256: e9eb668fd6aa14b1e26436f429b5550108af0a1dfd443b8cea0bcb3ab3028fca

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      dump_date: ${{ steps.prepare.outputs.dump_date }}
      aozora_commit: ${{ steps.prepare.outputs.aozora_commit }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Discover sources and create draft release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          DISCOVERY="$RUNNER_TEMP/discovery.json"
          PYTHONPATH=src python -m japanese_corpus discover --output "$DISCOVERY"

          DUMP_DATE=$(jq -r '.wikipedia.dump_date' "$DISCOVERY")
          AOZORA_COMMIT=$(jq -r '.aozora.repository_commit' "$DISCOVERY")
          JMDICT_ETAG=$(jq -r '.jmdict.etag' "$DISCOVERY")
          VERSION="v$(date -u +%Y.%m%d).${GITHUB_RUN_NUMBER}"
          SHOULD_BUILD=true

          PREVIOUS="$RUNNER_TEMP/previous-manifest.json"
          if gh release download --pattern manifest.json --output "$PREVIOUS" 2>/dev/null; then
            PREVIOUS_DUMP=$(jq -r '.sources.wikipedia.dump_date // ""' "$PREVIOUS")
            PREVIOUS_AOZORA=$(jq -r '.sources.aozora_bunko.repository_commit // ""' "$PREVIOUS")
            PREVIOUS_JMDICT=$(jq -r '.sources.jmdict.etag // ""' "$PREVIOUS")
            PREVIOUS_PIPELINE=$(jq -r '.release.pipeline_commit // ""' "$PREVIOUS")
            if [[ "$FORCE_BUILD" != "true" && "$PREVIOUS_DUMP" == "$DUMP_DATE" && "$PREVIOUS_AOZORA" == "$AOZORA_COMMIT" && "$PREVIOUS_JMDICT" == "$JMDICT_ETAG" && "$PREVIOUS_PIPELINE" == "$GITHUB_SHA" ]]; then
              SHOULD_BUILD=false
            fi
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c '.wikipedia.shards' "$DISCOVERY")" >> "$GITHUB_OUTPUT"
          echo "dump_date=$DUMP_DATE" >> "$GITHUB_OUTPUT"
          echo "aozora_commit=$AOZORA_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$SHOULD_BUILD" != "true" ]]; then
            exit 0
          fi

          IMMUTABLE=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false and (.immutable // false))] | length')
          if [[ "$IMMUTABLE" != "0" ]]; then
            echo "An immutable published release exists; it cannot be replaced." >&2
            exit 1
          fi

          while IFS= read -r STALE_TAG; do
            [[ -z "$STALE_TAG" ]] || gh release delete "$STALE_TAG" --cleanup-tag --yes
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == true and (.tag_name | startswith("v"))) | .tag_name')

          gh release create "$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "JapaneseCorpus $VERSION" \
            --notes "Corpus build in progress."
      - name: Save source discovery
        if: steps.prepare.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-discovery
          path: ${{ runner.temp }}/discovery.json
          retention-days: 1

  wikipedia:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
      - name: Build and upload Wikipedia shard
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          DUMP_DATE: ${{ needs.prepare.outputs.dump_date }}
          SHARD_URL: ${{ matrix.shard.url }}
          SHARD_SEQUENCE: ${{ matrix.shard.sequence }}
        run: |
          set -euo pipefail
          INPUT="$RUNNER_TEMP/${SHARD_SEQUENCE}.json.bz2"
          OUTPUT="$RUNNER_TEMP/wikipedia-${DUMP_DATE}-${SHARD_SEQUENCE}.jsonl.zst"
          STATS="$RUNNER_TEMP/wikipedia-${SHARD_SEQUENCE}.stats.json"
          curl --fail --location --retry 5 --retry-all-errors --output "$INPUT" "$SHARD_URL"
          PYTHONPATH=src python -m japanese_corpus build-wikipedia \
            "$INPUT" "$OUTPUT" --dump-date "$DUMP_DATE" --stats "$STATS"
          zstd --test "$OUTPUT"
          gh release upload "$RELEASE_TAG" "$OUTPUT"
      - name: Save Wikipedia statistics
        uses: actions/upload-artifact@v4
        with:
          name: stats-wikipedia-${{ matrix.shard.sequence }}
          path: ${{ runner.temp }}/wikipedia-${{ matrix.shard.sequence }}.stats.json
          retention-days: 1

  aozora:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
      - name: Fetch Aozora Bunko sources
        env:
          AOZORA_COMMIT: ${{ needs.prepare.outputs.aozora_commit }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/aozora-metadata.zip" \
            https://www.aozora.gr.jp/index_pages/list_person_all_extended_utf8.zip
          PYTHONPATH=src python -m japanese_corpus list-aozora-paths \
            --metadata-zip "$RUNNER_TEMP/aozora-metadata.zip" \
            --output "$RUNNER_TEMP/aozora-paths.txt"

          SOURCE="$RUNNER_TEMP/aozorabunko"
          git init "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/aozorabunko/aozorabunko.git
          git -C "$SOURCE" sparse-checkout init --no-cone
          git -C "$SOURCE" sparse-checkout set --no-cone --stdin < "$RUNNER_TEMP/aozora-paths.txt"
          git -C "$SOURCE" fetch --depth=1 --filter=blob:none origin "$AOZORA_COMMIT"
          git -C "$SOURCE" checkout --detach FETCH_HEAD
      - name: Build and upload Aozora Bunko corpus
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          AOZORA_COMMIT: ${{ needs.prepare.outputs.aozora_commit }}
        run: |
          set -euo pipefail
          SHORT_COMMIT=${AOZORA_COMMIT:0:12}
          OUTPUT="$RUNNER_TEMP/aozora-${SHORT_COMMIT}.jsonl.zst"
          STATS="$RUNNER_TEMP/aozora.stats.json"
          PYTHONPATH=src python -m japanese_corpus build-aozora \
            --metadata-zip "$RUNNER_TEMP/aozora-metadata.zip" \
            --source-root "$RUNNER_TEMP/aozorabunko" \
            --output "$OUTPUT" \
            --stats "$STATS" \
            --source-commit "$AOZORA_COMMIT"
          zstd --test "$OUTPUT"
          gh release upload "$RELEASE_TAG" "$OUTPUT"
      - name: Save Aozora Bunko statistics
        uses: actions/upload-artifact@v4
        with:
          name: stats-aozora
          path: ${{ runner.temp }}/aozora.stats.json
          retention-days: 1

  homophones:
    needs: [prepare, wikipedia, aozora]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 720
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install homophone build dependencies
        run: |
          set -euo pipefail
          command -v zstd && command -v xz || { sudo apt-get update && sudo apt-get install -y zstd xz-utils; }
          rustc --version
          cargo --version
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/vibrato-ipadic.tar.xz" \
            https://github.com/daac-tools/vibrato/releases/download/v0.5.0/ipadic-mecab-2_7_0.tar.xz
          echo "$VIBRATO_IPADIC_ARCHIVE_SHA256  $RUNNER_TEMP/vibrato-ipadic.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vibrato"
          tar -xJf "$RUNNER_TEMP/vibrato-ipadic.tar.xz" -C "$RUNNER_TEMP/vibrato"
          zstd --decompress --force \
            "$RUNNER_TEMP/vibrato/ipadic-mecab-2_7_0/system.dic.zst" \
            -o "$RUNNER_TEMP/vibrato/system.dic"
      - name: Download draft corpus assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corpus"
          gh release download "$RELEASE_TAG" \
            --pattern 'wikipedia-*.jsonl.zst' \
            --pattern 'aozora-*.jsonl.zst' \
            --dir "$RUNNER_TEMP/corpus"
          EXPECTED=$(($(jq 'length' <<< '${{ needs.prepare.outputs.matrix }}') + 1))
          ACTUAL=$(find "$RUNNER_TEMP/corpus" -maxdepth 1 -type f -name '*.jsonl.zst' | wc -l)
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Expected $EXPECTED corpus assets, downloaded $ACTUAL." >&2
            exit 1
          fi
          find "$RUNNER_TEMP/corpus" -maxdepth 1 -type f -name '*.jsonl.zst' \
            -print0 | sort -z | xargs -0 -n1 zstd --test
      - name: Build and upload curated homophone corpus
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/homophone-output"
          mkdir -p "$OUTPUT"
          mapfile -d '' INPUTS < <(
            find "$RUNNER_TEMP/corpus" -maxdepth 1 -type f -name '*.jsonl.zst' \
              -print0 | sort -z
          )
          INPUT_ARGS=()
          for INPUT in "${INPUTS[@]}"; do
            INPUT_ARGS+=(--input "$INPUT")
          done
          cargo run --release --locked \
            --manifest-path ngram-builder/Cargo.toml -- build-homophones \
            "${INPUT_ARGS[@]}" \
            --vibrato-dictionary "$RUNNER_TEMP/vibrato/system.dic" \
            --output-dir "$OUTPUT" \
            --min-natural-occurrences 2 \
            --min-natural-sentences 2 \
            --occurrence-shard-records 5000000 \
            --vibrato-dictionary-version "$VIBRATO_IPADIC_VERSION" \
            --pipeline-commit "$GITHUB_SHA"
          jq -e '.corpus.document_limit == null and .quality.selected_groups == .corpus.homophone_groups and .quality.selected_occurrences == .corpus.occurrences' \
            "$OUTPUT/homophone-manifest.json" >/dev/null
          zstd --test "$OUTPUT/homophone-groups.jsonl.zst"
          find "$OUTPUT" -maxdepth 1 -type f -name 'homophone-occurrences-*.jsonl.zst' \
            -print0 | sort -z | xargs -0 -n1 zstd --test
          (cd "$OUTPUT" && sha256sum --check HOMOPHONE-SHA256SUMS)
          mapfile -d '' ASSETS < <(find "$OUTPUT" -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}"
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/homophone-remote-assets.json"
          for ASSET in "${ASSETS[@]}"; do
            NAME=$(basename "$ASSET")
            LOCAL_SIZE=$(stat --format='%s' "$ASSET")
            REMOTE_SIZE=$(jq -r --arg name "$NAME" '.assets[] | select(.name == $name) | .size' \
              "$RUNNER_TEMP/homophone-remote-assets.json")
            if [[ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]]; then
              echo "Uploaded homophone asset size mismatch: $NAME local=$LOCAL_SIZE remote=$REMOTE_SIZE" >&2
              exit 1
            fi
          done
      - name: Save homophone metadata
        uses: actions/upload-artifact@v4
        with:
          name: homophone-metadata
          path: |
            ${{ runner.temp }}/homophone-output/homophone-manifest.json
            ${{ runner.temp }}/homophone-output/HOMOPHONE-SHA256SUMS
          retention-days: 1

  dictionary:
    needs: [prepare, wikipedia, aozora, english-dictionary]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download English dictionary for combined evaluation
        uses: actions/download-artifact@v4
        with:
          name: english-dictionary-metadata
          path: ${{ runner.temp }}/english
      - name: Install build dependencies
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd xz-utils; }
          rustc --version
          cargo --version
      - name: Download and verify draft corpus assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corpus"
          gh release download "$RELEASE_TAG" \
            --pattern 'wikipedia-*.jsonl.zst' \
            --pattern 'aozora-*.jsonl.zst' \
            --dir "$RUNNER_TEMP/corpus"
          EXPECTED=$(jq 'length + 1' <<< '${{ needs.prepare.outputs.matrix }}')
          ACTUAL=$(find "$RUNNER_TEMP/corpus" -maxdepth 1 -type f -name '*.jsonl.zst' | wc -l)
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Expected $EXPECTED corpus assets, downloaded $ACTUAL." >&2
            exit 1
          fi
          find "$RUNNER_TEMP/corpus" -maxdepth 1 -type f -name '*.jsonl.zst' \
            -print0 | sort -z | xargs -0 -n1 zstd --test
      - name: Fetch pinned tokenizer and Mozc context definitions
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/vibrato-ipadic.tar.xz" \
            https://github.com/daac-tools/vibrato/releases/download/v0.5.0/ipadic-mecab-2_7_0.tar.xz
          echo "$VIBRATO_IPADIC_ARCHIVE_SHA256  $RUNNER_TEMP/vibrato-ipadic.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vibrato"
          tar -xJf "$RUNNER_TEMP/vibrato-ipadic.tar.xz" -C "$RUNNER_TEMP/vibrato"
          zstd --decompress --force \
            "$RUNNER_TEMP/vibrato/ipadic-mecab-2_7_0/system.dic.zst" \
            -o "$RUNNER_TEMP/vibrato/system.dic"

          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/mozc-id.def" \
            "https://raw.githubusercontent.com/google/mozc/$MOZC_COMMIT/src/data/dictionary_oss/id.def"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/MOZC-LICENSE" \
            "https://raw.githubusercontent.com/google/mozc/$MOZC_COMMIT/LICENSE"
          echo "$MOZC_ID_DEF_SHA256  $RUNNER_TEMP/mozc-id.def" | sha256sum --check
      - name: Build exact full-corpus Mozc n-gram dictionaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ngram-output" "$RUNNER_TEMP/ngram-work"
          mapfile -d '' INPUTS < <(
            find "$RUNNER_TEMP/corpus" -maxdepth 1 -type f -name '*.jsonl.zst' \
              -print0 | sort -z
          )
          INPUT_ARGS=()
          for INPUT in "${INPUTS[@]}"; do
            INPUT_ARGS+=(--input "$INPUT")
          done
          cargo run --release --locked \
            --manifest-path ngram-builder/Cargo.toml -- build \
            "${INPUT_ARGS[@]}" \
            --vibrato-dictionary "$RUNNER_TEMP/vibrato/system.dic" \
            --mozc-id-def "$RUNNER_TEMP/mozc-id.def" \
            --mozc-license "$RUNNER_TEMP/MOZC-LICENSE" \
            --ipadic-copying "$RUNNER_TEMP/vibrato/ipadic-mecab-2_7_0/COPYING" \
            --ipadic-notice "$RUNNER_TEMP/vibrato/ipadic-mecab-2_7_0/NOTICE" \
            --output-dir "$RUNNER_TEMP/ngram-output" \
            --work-dir "$RUNNER_TEMP/ngram-work" \
            --unigram-min-count 16 \
            --ngram-min-count 32 \
            --map-min-count 2 \
            --cost-scale 800 \
            --entries-per-shard 1000000 \
            --mozc-commit "$MOZC_COMMIT" \
            --vibrato-dictionary-version "$VIBRATO_IPADIC_VERSION" \
            --pipeline-commit "$GITHUB_SHA"
      - name: Evaluate conversion accuracy with pinned AJIMEE-Bench
        run: |
          set -euo pipefail
          DATASET="$RUNNER_TEMP/ajimee-evaluation-items.json"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$DATASET" \
            "https://raw.githubusercontent.com/azooKey/AJIMEE-Bench/$AJIMEE_COMMIT/JWTD_v2/v1/evaluation_items.json"
          echo "$AJIMEE_DATA_SHA256  $DATASET" | sha256sum --check
          cargo run --quiet --release --locked \
            --manifest-path conversion-engine/Cargo.toml --bin ajimee-bench -- \
            --dictionary "$RUNNER_TEMP/ngram-output" \
            --dictionary "$RUNNER_TEMP/english" \
            --dataset "$DATASET" \
            --output "$RUNNER_TEMP/ngram-output/ajimee-bench-report.json" \
            --benchmark-commit "$AJIMEE_COMMIT" \
            --minimum-accuracy-at-1 0.50 \
            --maximum-mean-min-cer 0.09
      - name: Validate and upload dictionary assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/ngram-output"
          while IFS= read -r -d '' ASSET; do
            zstd --test "$ASSET"
            zstd --decompress --stdout "$ASSET" | awk -F '\t' '
              NF != 5 { print "invalid Mozc column count at line " NR > "/dev/stderr"; exit 1 }
              $2 !~ /^[0-9]+$/ || $3 !~ /^[0-9]+$/ || $4 !~ /^[0-9]+$/ {
                print "invalid numeric Mozc field at line " NR > "/dev/stderr"; exit 1
              }
            '
          done < <(find "$OUTPUT" -maxdepth 1 -type f -name 'mozc-*.txt.zst' -print0 | sort -z)
          jq -e '.orders | length == 3 and all(.retained_entries > 0)' \
            "$OUTPUT/ngram-manifest.json" >/dev/null
          (cd "$OUTPUT" && sha256sum --check NGRAM-SHA256SUMS)

          while IFS= read -r -d '' ASSET; do
            SIZE=$(stat --format='%s' "$ASSET")
            if (( SIZE >= 2147483648 )); then
              echo "Release asset exceeds 2 GiB: $ASSET" >&2
              exit 1
            fi
          done < <(find "$OUTPUT" -maxdepth 1 -type f -print0)
          mapfile -d '' ASSETS < <(find "$OUTPUT" -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}"
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/ngram-remote-assets.json"
          for ASSET in "${ASSETS[@]}"; do
            NAME=$(basename "$ASSET")
            LOCAL_SIZE=$(stat --format='%s' "$ASSET")
            REMOTE_SIZE=$(jq -r --arg name "$NAME" '.assets[] | select(.name == $name) | .size' \
              "$RUNNER_TEMP/ngram-remote-assets.json")
            if [[ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]]; then
              echo "Uploaded dictionary asset size mismatch: $NAME local=$LOCAL_SIZE remote=$REMOTE_SIZE" >&2
              exit 1
            fi
          done
      - name: Save dictionary metadata
        uses: actions/upload-artifact@v4
        with:
          name: ngram-metadata
          path: |
            ${{ runner.temp }}/ngram-output/ngram-manifest.json
            ${{ runner.temp }}/ngram-output/NGRAM-SHA256SUMS
            ${{ runner.temp }}/ngram-output/ajimee-bench-report.json
          retention-days: 1

  english-dictionary:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
          rustc --version
          cargo --version
      - name: Download source discovery
        uses: actions/download-artifact@v4
        with:
          name: release-discovery
          path: ${{ runner.temp }}/discovery
      - name: Fetch pinned JMdict and dictionary metadata
        run: |
          set -euo pipefail
          DISCOVERY="$RUNNER_TEMP/discovery/discovery.json"
          JMDICT_URL=$(jq -r '.jmdict.url' "$DISCOVERY")
          JMDICT_ETAG=$(jq -r '.jmdict.etag' "$DISCOVERY")
          curl --fail --location --retry 5 --retry-all-errors \
            --header "If-Match: $JMDICT_ETAG" \
            --output "$RUNNER_TEMP/JMdict_e.gz" \
            "$JMDICT_URL"
          gzip --test "$RUNNER_TEMP/JMdict_e.gz"

          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/mozc-id.def" \
            "https://raw.githubusercontent.com/google/mozc/$MOZC_COMMIT/src/data/dictionary_oss/id.def"
          echo "$MOZC_ID_DEF_SHA256  $RUNNER_TEMP/mozc-id.def" | sha256sum --check
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/JMDICT-LICENSE.html" \
            https://www.edrdg.org/edrdg/licence.html
      - name: Build and test hiragana-to-English dictionary
        run: |
          set -euo pipefail
          DISCOVERY="$RUNNER_TEMP/discovery/discovery.json"
          JMDICT_URL=$(jq -r '.jmdict.url' "$DISCOVERY")
          JMDICT_ETAG=$(jq -r '.jmdict.etag' "$DISCOVERY")
          JMDICT_LAST_MODIFIED=$(jq -r '.jmdict.last_modified' "$DISCOVERY")
          OUTPUT="$RUNNER_TEMP/english-output"
          mkdir -p "$OUTPUT"
          cargo run --release --locked \
            --manifest-path jmdict-builder/Cargo.toml -- build \
            --input "$RUNNER_TEMP/JMdict_e.gz" \
            --mozc-id-def "$RUNNER_TEMP/mozc-id.def" \
            --jmdict-license "$RUNNER_TEMP/JMDICT-LICENSE.html" \
            --output-dir "$OUTPUT" \
            --entries-per-shard 1000000 \
            --base-cost 12000 \
            --source-url "$JMDICT_URL" \
            --source-etag "$JMDICT_ETAG" \
            --source-last-modified "$JMDICT_LAST_MODIFIED" \
            --pipeline-commit "$GITHUB_SHA"

          while IFS= read -r -d '' ASSET; do
            zstd --test "$ASSET"
            zstd --decompress --stdout "$ASSET" | awk -F '\t' '
              NF != 5 { print "invalid Mozc column count at line " NR > "/dev/stderr"; exit 1 }
              $2 !~ /^[0-9]+$/ || $3 !~ /^[0-9]+$/ || $4 !~ /^[0-9]+$/ {
                print "invalid numeric Mozc field at line " NR > "/dev/stderr"; exit 1
              }
            '
          done < <(find "$OUTPUT" -maxdepth 1 -type f -name 'mozc-english-unigram-*.txt.zst' -print0 | sort -z)
          jq -e '.counts.retained_entries > 100000 and .counts.unique_readings > 60000' \
            "$OUTPUT/english-dictionary-manifest.json" >/dev/null
          (cd "$OUTPUT" && sha256sum --check ENGLISH-DICTIONARY-SHA256SUMS)

          COMPUTER=$(cargo run --quiet --release --locked \
            --manifest-path conversion-engine/Cargo.toml --bin kana-kanji-converter -- \
            --dictionary "$OUTPUT" --candidates 10 こんぴゅーた)
          ART=$(cargo run --quiet --release --locked \
            --manifest-path conversion-engine/Cargo.toml --bin kana-kanji-converter -- \
            --dictionary "$OUTPUT" --candidates 10 あーと)
          grep -q $'\tcomputer$' <<<"$COMPUTER"
          grep -q $'\tart$' <<<"$ART"
      - name: Upload English dictionary assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/english-output"
          mapfile -d '' ASSETS < <(find "$OUTPUT" -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}"
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/english-remote-assets.json"
          for ASSET in "${ASSETS[@]}"; do
            NAME=$(basename "$ASSET")
            LOCAL_SIZE=$(stat --format='%s' "$ASSET")
            REMOTE_SIZE=$(jq -r --arg name "$NAME" '.assets[] | select(.name == $name) | .size' \
              "$RUNNER_TEMP/english-remote-assets.json")
            if [[ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]]; then
              echo "Uploaded English dictionary asset size mismatch: $NAME local=$LOCAL_SIZE remote=$REMOTE_SIZE" >&2
              exit 1
            fi
          done
      - name: Save English dictionary metadata
        uses: actions/upload-artifact@v4
        with:
          name: english-dictionary-metadata
          path: |
            ${{ runner.temp }}/english-output/english-dictionary-manifest.json
            ${{ runner.temp }}/english-output/ENGLISH-DICTIONARY-SHA256SUMS
            ${{ runner.temp }}/english-output/mozc-english-unigram-*.txt.zst
          retention-days: 1

  finalize:
    needs: [prepare, wikipedia, aozora, homophones, dictionary, english-dictionary]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          path: ${{ runner.temp }}/stats
          merge-multiple: true
      - name: Download source discovery
        uses: actions/download-artifact@v4
        with:
          name: release-discovery
          path: ${{ runner.temp }}/discovery
      - name: Download dictionary metadata
        uses: actions/download-artifact@v4
        with:
          name: ngram-metadata
          path: ${{ runner.temp }}/ngram
      - name: Download English dictionary metadata
        uses: actions/download-artifact@v4
        with:
          name: english-dictionary-metadata
          path: ${{ runner.temp }}/english
      - name: Download homophone metadata
        uses: actions/download-artifact@v4
        with:
          name: homophone-metadata
          path: ${{ runner.temp }}/homophone
      - name: Verify, publish, and prune releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          DUMP_DATE: ${{ needs.prepare.outputs.dump_date }}
          AOZORA_COMMIT: ${{ needs.prepare.outputs.aozora_commit }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/assets.json"
          PYTHONPATH=src python -m japanese_corpus verify-assets \
            --stats-dir "$RUNNER_TEMP/stats" \
            --assets-json "$RUNNER_TEMP/assets.json"

          PYTHONPATH=src python -m japanese_corpus build-manifest \
            --stats-dir "$RUNNER_TEMP/stats" \
            --discovery "$RUNNER_TEMP/discovery/discovery.json" \
            --output "$RUNNER_TEMP/manifest.json" \
            --checksums "$RUNNER_TEMP/SHA256SUMS" \
            --version "$RELEASE_TAG" \
            --pipeline-commit "$GITHUB_SHA" \
            --dictionary-manifest "$RUNNER_TEMP/ngram/ngram-manifest.json" \
            --dictionary-checksums "$RUNNER_TEMP/ngram/NGRAM-SHA256SUMS" \
            --english-dictionary-manifest "$RUNNER_TEMP/english/english-dictionary-manifest.json" \
            --english-dictionary-checksums "$RUNNER_TEMP/english/ENGLISH-DICTIONARY-SHA256SUMS" \
            --ajimee-report "$RUNNER_TEMP/ngram/ajimee-bench-report.json"

          RECORDS=$(jq -r '.totals.records' "$RUNNER_TEMP/manifest.json")
          CHARACTERS=$(jq -r '.totals.characters' "$RUNNER_TEMP/manifest.json")
          UNIGRAMS=$(jq -r '.dictionaries.orders[] | select(.order == 1) | .retained_entries' "$RUNNER_TEMP/manifest.json")
          BIGRAMS=$(jq -r '.dictionaries.orders[] | select(.order == 2) | .retained_entries' "$RUNNER_TEMP/manifest.json")
          TRIGRAMS=$(jq -r '.dictionaries.orders[] | select(.order == 3) | .retained_entries' "$RUNNER_TEMP/manifest.json")
          ENGLISH_ENTRIES=$(jq -r '.english_dictionary.counts.retained_entries' "$RUNNER_TEMP/manifest.json")
          HOMOPHONE_GROUPS=$(jq -r '.corpus.homophone_groups' "$RUNNER_TEMP/homophone/homophone-manifest.json")
          HOMOPHONE_CANDIDATES=$(jq -r '.corpus.candidate_forms' "$RUNNER_TEMP/homophone/homophone-manifest.json")
          HOMOPHONE_OCCURRENCES=$(jq -r '.corpus.occurrences' "$RUNNER_TEMP/homophone/homophone-manifest.json")
          JMDICT_CREATED=$(jq -r '.sources.jmdict.created' "$RUNNER_TEMP/manifest.json")
          AJIMEE_ACCURACY=$(jq -r '.benchmarks.ajimee.metrics.overall.accuracy_at_1' "$RUNNER_TEMP/manifest.json")
          AJIMEE_MINCER=$(jq -r '.benchmarks.ajimee.metrics.overall.mean_min_cer' "$RUNNER_TEMP/manifest.json")
          AOZORA_SHORT=${AOZORA_COMMIT:0:12}
          {
            echo "Automated Japanese corpus release."
            echo
            echo "- Japanese Wikipedia dump: $DUMP_DATE"
            echo "- Aozora Bunko repository commit: $AOZORA_SHORT"
            echo "- Documents: $RECORDS"
            echo "- Characters: $CHARACTERS"
            echo "- Mozc unigram entries: $UNIGRAMS"
            echo "- Mozc bigram entries: $BIGRAMS"
            echo "- Mozc trigram entries: $TRIGRAMS"
            echo "- JMdict source date: $JMDICT_CREATED"
            echo "- Hiragana-to-English entries: $ENGLISH_ENTRIES"
            echo "- Natural homophone groups: $HOMOPHONE_GROUPS ($HOMOPHONE_CANDIDATES candidate forms, $HOMOPHONE_OCCURRENCES occurrences)"
            echo "- AJIMEE-Bench Accuracy@1: $AJIMEE_ACCURACY"
            echo "- AJIMEE-Bench mean MinCER: $AJIMEE_MINCER"
            echo
            echo "See manifest.json, SHA256SUMS, the dictionary manifests, and NOTICE.md for provenance and verification."
          } > "$RUNNER_TEMP/release-notes.md"

          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/manifest.json" \
            "$RUNNER_TEMP/SHA256SUMS" \
            NOTICE.md \
            LICENSE-DATA.md \
            schema/corpus-record.schema.json \
            schema/release-manifest.schema.json \
            schema/ngram-manifest.schema.json \
            schema/english-dictionary-manifest.schema.json \
            schema/ajimee-bench-report.schema.json
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest \
            --title "JapaneseCorpus $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

          while IFS= read -r OLD_TAG; do
            if [[ -n "$OLD_TAG" && "$OLD_TAG" != "$RELEASE_TAG" ]]; then
              gh release delete "$OLD_TAG" --cleanup-tag --yes
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')

          RELEASES="$RUNNER_TEMP/releases.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RELEASES"
          COUNT=$(jq '[.[] | select(.draft == false)] | length' "$RELEASES")
          ONLY_TAG=$(jq -r '[.[] | select(.draft == false)][0].tag_name // ""' "$RELEASES")
          if [[ "$COUNT" != "1" || "$ONLY_TAG" != "$RELEASE_TAG" ]]; then
            echo "Expected one published release ($RELEASE_TAG), found $COUNT ($ONLY_TAG)." >&2
            exit 1
          fi
