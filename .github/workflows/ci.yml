name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
      - name: Compile Python sources
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate JSON files and CLI
        run: |
          python -m json.tool schema/corpus-record.schema.json >/dev/null
          python -m json.tool schema/release-manifest.schema.json >/dev/null
          PYTHONPATH=src python -m japanese_corpus --help >/dev/null
