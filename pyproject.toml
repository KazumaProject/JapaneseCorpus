[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-corpus"
version = "0.1.0"
description = "Reproducible Japanese corpus builder for Wikipedia and Aozora Bunko"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KazumaProject" }]

[project.optional-dependencies]
homophones = [
    "SudachiPy>=0.6.8",
    "SudachiDict-core>=20240109",
]

[project.scripts]
japanese-corpus = "japanese_corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
